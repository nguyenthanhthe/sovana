  <text x="174" y="114" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', monospace" font-size="12" font-weight="500" letter-spacing="1.4">EPHEMERIS · BI-TEMPORAL GIS · DETERMINISTIC KERNEL</text>

