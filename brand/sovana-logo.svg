    <circle cx="256" cy="256" r="168" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="6 10"/>
    <line x1="256" y1="64" x2="256" y2="448" stroke="#06B6D4" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="64" y1="256" x2="448" y2="256" stroke="#06B6D4" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="256" y1="64" x2="256" y2="88" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <line x1="256" y1="424" x2="256" y2="448" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <line x1="64" y1="256" x2="88" y2="256" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <line x1="424" y1="256" x2="448" y2="256" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="256" cy="256" rx="184" ry="74" transform="rotate(-23.44 256 256)" fill="none" stroke="url(#eclipticGrad)" stroke-width="11"/>
    <ellipse cx="256" cy="256" rx="140" ry="140" fill="none" stroke="#334155" stroke-width="3"/>
    <path d="M256 176 L274 238 L336 256 L274 274 L256 336 L238 274 L176 256 L238 238 Z" fill="#F8FAFC"/>
