<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SOVANA Mark">
  <defs>
    <linearGradient id="eclipticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian Space Canvas -->
  <rect width="512" height="512" rx="96" fill="#0B0F17"/>
  <rect x="16" y="16" width="480" height="480" rx="82" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Polar Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)"/>

  <!-- Outer Precision Calibration Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- Meridian Crosshair (Terrestrial Longitude/Latitude Reference) -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Cardinal Tick Marks -->
  <line x1="256" y1="64" x2="256" y2="88" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="424" x2="256" y2="448" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="256" x2="88" y2="256" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <line x1="424" y1="256" x2="448" y2="256" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- 23.44 deg Earth Axial Tilt Ecliptic Ring -->
  <ellipse cx="256" cy="256" rx="184" ry="74" transform="rotate(-23.44 256 256)" fill="none" stroke="url(#eclipticGrad)" stroke-width="10"/>
  <ellipse cx="256" cy="256" rx="140" ry="140" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Central Polaris 4-Point Precision Vertex -->
  <path d="M256 176 L274 238 L336 256 L274 274 L256 336 L238 274 L176 256 L238 238 Z" fill="#F8FAFC"/>
  <path d="M256 204 L267 245 L308 256 L267 267 L256 308 L245 267 L204 256 L245 245 Z" fill="#D4AF37"/>
  <circle cx="256" cy="256" r="10" fill="#0B0F17" stroke="#F8FAFC" stroke-width="3"/>
</svg>
