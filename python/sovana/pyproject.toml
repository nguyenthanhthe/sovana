[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sovana"
version = "0.2.0"
description = "Deterministic astronomical ephemeris, bi-temporal Vietnam GIS, and symbolic engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sovana"]

[tool.hatch.build.targets.sdist]
include = ["src/sovana", "README.md", "pyproject.toml"]
